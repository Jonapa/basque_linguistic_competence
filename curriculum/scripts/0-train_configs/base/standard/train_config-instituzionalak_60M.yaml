base_model: HiTZ/Latxa-Llama-3.1-8B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

load_in_8bit: false
load_in_4bit: false
strict: false
gptq: false

device_map: null

datasets:
  - path: <TODO>/basque_linguistic_competence/curriculum/corpus/instituzionalak_60M.jsonl
    type: completion
    field: text

dataset_prepared_path: <TODO>/basque_linguistic_competence/curriculum/cache/dataset_cache

output_dir: <TODO>/basque_linguistic_competence/curriculum/cache/model/instituzionalak_60M

sequence_len: 8192
sample_packing: true
eval_sample_packing: true 
val_set_size: 0.0
eval_causal_lm_metrics: []
pad_to_sequence_len: true

special_tokens:
   pad_token: <|end_of_text|>

neftune_noise_alpha: 5 # https://huggingface.co/docs/trl/sft_trainer#enhance-the-models-performances-using-neftune

gradient_accumulation_steps: 8
warmup_ratio: 0.05
micro_batch_size: 8
eval_batch_size: 
num_epochs: 3
learning_rate: 1e-5
max_grad_norm: 1.0
cosine_min_lr_ratio: 0.1

# Llama 3 reccomended
optimizer: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1e-8
lr_scheduler: cosine
weight_decay: 0.1

early_stop_epoch: 1  # Stop after epoch 1

gradient_checkpointing: true
deepspeed: <TODO>/basque_linguistic_competence/curriculum/scripts/0-train_configs/common/deepspeed_config-8B-STAGE2.json

train_on_inputs: false
group_by_length: false
bf16: true
fp16: false
tf32: false

logging_steps: 1
flash_attention: true

saves_per_epoch: 1
save_total_limit: 10

seed: 33

plugins:
  - axolotl.integrations.liger.LigerPlugin
  - early_stopping_plugin.EarlyStopEpochPlugin
liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
liger_layer_norm: true
liger_fused_linear_cross_entropy: true
